<svg xmlns="http://www.w3.org/2000/svg" width="820" height="350" viewBox="0 0 820 350" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'DejaVu Sans Mono', 'Courier New', monospace; font-size: 15px; }
    .prompt { fill: #22d3ee; font-weight: 600; }
    .path { fill: #7aa2f7; font-weight: 600; }
    .cmd { fill: #e6edf3; }
    .out { fill: #9ece6a; }
    .dim { fill: #8b949e; }
    .line { opacity: 0; animation: show 0.01s linear forwards; }
    .mask { animation: type 0.8s steps(20) forwards; }
    .reply { opacity: 0; animation: rise 0.45s ease-out forwards; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .glow { animation: glow 3s ease-in-out infinite; }
    @keyframes show { to { opacity: 1; } }
    @keyframes type { to { transform: translateX(300px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes glow { 0%, 100% { stroke-opacity: 0.35; } 50% { stroke-opacity: 0.9; } }
  </style>

  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="818" height="348" rx="12" fill="#0d1117"/>
  <rect class="glow" x="1" y="1" width="818" height="348" rx="12" fill="none" stroke="url(#border)" stroke-width="2"/>
  <path d="M1 13 a12 12 0 0 1 12 -12 h794 a12 12 0 0 1 12 12 v25 h-818 z" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="20" r="6" fill="#27c93f"/>
  <text x="410" y="25" text-anchor="middle" class="mono dim" font-size="13">sarayut@foodstacks: ~/profile</text>

  <!-- 1 -->
  <g class="line" style="animation-delay:0.3s">
    <text x="24" y="72" class="mono"><tspan class="prompt">sarayut</tspan><tspan class="dim">@</tspan><tspan class="path">dev</tspan><tspan class="dim"> ~$ </tspan><tspan class="cmd">whoami</tspan></text>
    <rect class="mask" style="animation-delay:0.3s" x="158" y="56" width="300" height="22" fill="#0d1117"/>
  </g>
  <text x="24" y="98" class="mono out reply" style="animation-delay:1.2s">Sarayut Pintakham — Full-Stack Developer</text>

  <!-- 2 -->
  <g class="line" style="animation-delay:1.6s">
    <text x="24" y="134" class="mono"><tspan class="prompt">sarayut</tspan><tspan class="dim">@</tspan><tspan class="path">dev</tspan><tspan class="dim"> ~$ </tspan><tspan class="cmd">cat location.txt</tspan></text>
    <rect class="mask" style="animation-delay:1.6s" x="158" y="118" width="300" height="22" fill="#0d1117"/>
  </g>
  <text x="24" y="160" class="mono out reply" style="animation-delay:2.5s">Mueang Bueng Kan, Thailand</text>

  <!-- 3 -->
  <g class="line" style="animation-delay:2.9s">
    <text x="24" y="196" class="mono"><tspan class="prompt">sarayut</tspan><tspan class="dim">@</tspan><tspan class="path">dev</tspan><tspan class="dim"> ~$ </tspan><tspan class="cmd">echo $MAIN_STACK</tspan></text>
    <rect class="mask" style="animation-delay:2.9s" x="158" y="180" width="300" height="22" fill="#0d1117"/>
  </g>
  <text x="24" y="222" class="mono out reply" style="animation-delay:3.8s">TypeScript / Next.js  ·  real-time &amp; scalable systems</text>

  <!-- 4 -->
  <g class="line" style="animation-delay:4.2s">
    <text x="24" y="258" class="mono"><tspan class="prompt">sarayut</tspan><tspan class="dim">@</tspan><tspan class="path">dev</tspan><tspan class="dim"> ~$ </tspan><tspan class="cmd">./learning --now</tspan></text>
    <rect class="mask" style="animation-delay:4.2s" x="158" y="242" width="300" height="22" fill="#0d1117"/>
  </g>
  <text x="24" y="284" class="mono out reply" style="animation-delay:5.1s">PostgreSQL  ·  Go  ·  Python   →   current quest: FoodStacks</text>

  <!-- prompt + cursor -->
  <g class="line" style="animation-delay:5.5s">
    <text x="24" y="320" class="mono"><tspan class="prompt">sarayut</tspan><tspan class="dim">@</tspan><tspan class="path">dev</tspan><tspan class="dim"> ~$ </tspan></text>
    <rect class="cursor" x="160" y="306" width="9" height="18" fill="#22d3ee"/>
  </g>
</svg>
