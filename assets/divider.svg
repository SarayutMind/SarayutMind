<svg xmlns="http://www.w3.org/2000/svg" width="800" height="10" viewBox="0 0 800 10" preserveAspectRatio="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .shine { animation: slide 3.2s linear infinite; }
    @keyframes slide { from { transform: translateX(-220px); } to { transform: translateX(820px); } }
  </style>
  <defs>
    <linearGradient id="base" x1="0" x2="1">
      <stop offset="0" stop-color="#0891b2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0891b2" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hi" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a5f3fc" stop-opacity="1"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect x="0" y="0" width="800" height="10"/></clipPath>
  </defs>
  <rect x="0" y="4" width="800" height="2" rx="1" fill="url(#base)"/>
  <g clip-path="url(#c)"><rect class="shine" x="0" y="3" width="200" height="4" rx="2" fill="url(#hi)"/></g>
</svg>
